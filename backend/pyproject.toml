[project]
name="primevpn-backend"
version="100.0.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.9,<3","pydantic-settings>=2.6,<3","sqlalchemy>=2.0,<3","alembic>=1.14,<2","psycopg[binary]>=3.2,<4","argon2-cffi>=23.1,<26","PyJWT>=2.10,<3","pyotp>=2.9,<3","cryptography>=43,<47","httpx>=0.28,<1","asyncssh>=2.19,<3"]
[project.optional-dependencies]
test=["pytest>=8,<9","httpx>=0.28,<1"]
[tool.pytest.ini_options]
testpaths=["tests"]
[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
include=["app*"]
exclude=["app.node-agent*"]
